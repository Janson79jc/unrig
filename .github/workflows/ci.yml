name: Unrig CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Enforce zero runtime third-party dependencies
        if: matrix.python-version == '3.11' || matrix.python-version == '3.12' || matrix.python-version == '3.13'
        run: python -c "import tomllib, pathlib; data = tomllib.loads(pathlib.Path('pyproject.toml').read_text('utf-8')); assert data.get('project', {}).get('dependencies') == [], f'Expected zero deps, got: {data}'"

      - name: Run full pytest suite
        run: python -m pytest -v

      - name: Run Unrig Referee Escape-Replay suite
        run: unrig replay

      - name: Run Unrig self-verification
        run: unrig verify --root .

      - name: Run Unrig ratchet tightness check
        run: unrig ratchet --root . --check

      - name: Run Escape-Replay standalone demo
        run: python examples/escape-replay/run_demo.py
