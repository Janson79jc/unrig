[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unrig"
version = "0.1.0"
description = "Anti-tamper gates, JUnit/diff verification, and isolated blind review templates for coding agents."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Chen Jiang" }]
keywords = ["coding-agents", "guardrails", "anti-tamper", "testing", "verification", "cli"]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/Janson79jc/unrig"
Repository = "https://github.com/Janson79jc/unrig"
Issues = "https://github.com/Janson79jc/unrig/issues"
Changelog = "https://github.com/Janson79jc/unrig/blob/main/CHANGELOG.md"

[project.scripts]
unrig = "unrig.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "setuptools>=68.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unrig = ["templates/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
